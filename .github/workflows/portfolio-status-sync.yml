name: Controlled portfolio status sync
# one-shot retrigger after workflow registration

on:
  push:
    branches:
      - chore/portfolio-sync-scrolllibrary-20260912
    paths:
      - .github/workflows/portfolio-status-sync.yml

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: chore/portfolio-sync-scrolllibrary-20260912
          fetch-depth: 0

      - name: Replace only verified ScrollLibrary status text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected exactly one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "PROJECT_PORTFOLIO.md",
              "- `scroll-wisdom-weave-d69aa349` — **FLAGSHIP / CANONICAL / LINEAGE RESOLVED**.",
              "- `scroll-wisdom-weave-d69aa349` — **FLAGSHIP / CANONICAL / LINEAGE RESOLVED / VERIFIED**.",
          )
          replace_once(
              "PROJECT_PORTFOLIO.md",
              "All four sibling READMEs now point development to the canonical repository. Canonical `LINEAGE.md` is proposed through protected PR #22 on exact head `1e72709b965c0ed2723574e32ddd9db095438948`; its first run exposed a newly published xmldom dependency advisory and two stale real-E2E assertions. Those gates are being repaired on a separate controlled branch; PR #22 will not be merged until the permanent gates pass. No sibling has been archived or deleted.",
              "All four sibling READMEs point development to the canonical repository, and canonical `LINEAGE.md` is now merged. The first documentation PR (#22) was preserved and closed as superseded after its pre-repair checks exposed an xmldom dependency advisory and two stale real-reader E2E assertions. Controlled repair PR #23 fixed those issues and merged at `7c81c18fe6e7a4ebe9ac2eb157773742f64e93b9` only after CI, GA Real E2E, Dependency Review, EPUB Conformance and CodeQL all passed. The clean lineage successor PR #24 then passed the same five permanent gates and merged at `a28d304ae1818a598de76db403b591dc1a93b0c2`. The temporary write-enabled repair workflow removed itself before PR review. No sibling has been archived or deleted.",
          )

          replace_once(
              "GITHUB_OPTIMIZATION.md",
              "- `scroll-wisdom-weave-d69aa349` — **CANONICAL / LINEAGE RESOLVED**.",
              "- `scroll-wisdom-weave-d69aa349` — **CANONICAL / LINEAGE RESOLVED / VERIFIED**.",
          )
          replace_once(
              "GITHUB_OPTIMIZATION.md",
              "- Canonical lineage documentation is in protected PR #22. Its initial proof run exposed a newly published xmldom dependency advisory and two stale real-reader E2E assertions; those are being repaired separately rather than bypassed.\n- **LINEAGE RESOLVED does not mean VERIFIED.** ScrollLibrary quality/security/release status continues to depend on its permanent controlled gates.",
              "- Controlled repair PR #23 pinned patched `@xmldom/xmldom` 0.8.15 and corrected the two stale real-reader assertions; it merged at `7c81c18fe6e7a4ebe9ac2eb157773742f64e93b9` after CI, GA Real E2E, Dependency Review, EPUB Conformance and CodeQL all passed.\n- The temporary write-enabled repair workflow self-deleted before protected PR review.\n- Original lineage PR #22 was closed as superseded rather than force-rewritten. Clean successor PR #24 was rebuilt from repaired `main`, passed the same five permanent gates and merged at `a28d304ae1818a598de76db403b591dc1a93b0c2`.\n- ScrollLibrary therefore satisfies the portfolio definition of **VERIFIED** for the current controlled repository tree. No sibling has been archived or deleted.",
          )
          PY

      - name: Verify intended documentation state
        shell: bash
        run: |
          grep -F '**FLAGSHIP / CANONICAL / LINEAGE RESOLVED / VERIFIED**' PROJECT_PORTFOLIO.md
          grep -F '**CANONICAL / LINEAGE RESOLVED / VERIFIED**' GITHUB_OPTIMIZATION.md
          grep -F 'a28d304ae1818a598de76db403b591dc1a93b0c2' PROJECT_PORTFOLIO.md GITHUB_OPTIMIZATION.md
          ! grep -F 'Canonical `LINEAGE.md` is proposed through protected PR #22' PROJECT_PORTFOLIO.md
          git diff --check

      - name: Commit only the two ledgers and remove temporary writer
        shell: bash
        run: |
          rm .github/workflows/portfolio-status-sync.yml
          git add PROJECT_PORTFOLIO.md GITHUB_OPTIMIZATION.md .github/workflows/portfolio-status-sync.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/portfolio-status-sync.yml' 'GITHUB_OPTIMIZATION.md' 'PROJECT_PORTFOLIO.md' | sort)"
          test "$changed" = "$expected" || {
            echo "Refusing unexpected paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name "portfolio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: mark ScrollLibrary lineage resolved and verified"
          git push origin HEAD:chore/portfolio-sync-scrolllibrary-20260912
